# AirPanel 服务端多架构镜像构建与推送（amd64 + arm64）
# 触发方式：
#   1) 手动：Actions → "Build & Push Docker Image" → Run workflow（可填自定义 tag）
#   2) 自动：push 形如 v* 的 tag（如 v1.2.0）
# 前置：在仓库 Settings → Secrets and variables → Actions 配置：
#   DOCKERHUB_USERNAME = 你的 Docker Hub 用户名
#   DOCKERHUB_TOKEN    = Docker Hub Access Token（Account Settings → Security → Personal access tokens）
name: Build & Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（默认 latest）'
        required: false
        default: 'latest'
  push:
    tags:
      - 'v*'

env:
  # 镜像名：<DockerHub用户名>/airpanel
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/airpanel

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch arm64 模拟)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./server-go
          file: ./server-go/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # 手动触发用输入的 tag，tag 推送用 git tag 名
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag || github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
